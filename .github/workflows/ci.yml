name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 — PHP 8.1–8.3
          - php: '8.1'
            laravel: '10'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '10'
            testbench: '^8.0'
          - php: '8.3'
            laravel: '10'
            testbench: '^8.0'
          # Laravel 11 — PHP 8.2–8.4
          - php: '8.2'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.4'
            laravel: '11'
            testbench: '^9.0'
          # Laravel 12 — PHP 8.2–8.4
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
          # Laravel 13 — PHP 8.3–8.4
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer update \
            --with="illuminate/contracts:^${{ matrix.laravel }}.0" \
            --with="illuminate/http:^${{ matrix.laravel }}.0" \
            --with="illuminate/support:^${{ matrix.laravel }}.0" \
            --with="illuminate/events:^${{ matrix.laravel }}.0" \
            --with="illuminate/routing:^${{ matrix.laravel }}.0" \
            --with="orchestra/testbench:${{ matrix.testbench }}" \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Run tests
        run: composer test
